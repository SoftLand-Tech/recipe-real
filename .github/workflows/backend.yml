name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          # The example enables the dangerous agy flag for local docs; CI must
          # see the shipped default (absent => false) that the lockdown test asserts.
          sed -i '/^RECIPE_AI_CLI_DANGEROUSLY_SKIP_PERMISSIONS=/d' .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build frontend assets
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pint (lint)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run tests
        working-directory: backend
        run: php artisan test --compact
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
