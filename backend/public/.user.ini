; Per-directory PHP overrides for CGI/FPM (production).
; The admin FileUpload advertises 100 MB videos / 8 MB images, so the
; interpreter must allow at least that. System php.ini still wins for
; `php artisan serve` — run it with `-d` flags or fix /etc/php/php.ini.
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
